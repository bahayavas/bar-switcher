# Bar Switcher — bar listesi (switch.sh ve uygulama ikisi de bunu okur)
# Varsayılan sıra buradaki sıradır; Ayarlar → Barlar'dan değiştirilebilir (settings.json "order").
#
# id | görünen ad | tür | bundle id | uygulama/binary yolu | ayar yolu(ları, virgülle; ilk var olan açılır) | rozet
#
# tür:
#   binary              tek bir program (TERM ile kapanır), ör. SketchyBar
#   app                 normal .app (önce Quit, sonra TERM/KILL)
#   ubersicht:only=X    Übersicht, yalnızca widgets/X açık
#   ubersicht:except=X  Übersicht, widgets/X kapalı, diğer widget'lar açık
sketchybar|SketchyBar|binary|-|/opt/homebrew/bin/sketchybar|~/.config/sketchybar/|SB
barik|Barik|app|Pansy.Barik|/Applications/Barik.app|~/.barik-config.toml,~/.config/barik/config.toml|BK
simplebar|simple-bar|ubersicht:only=simple-bar|tracesOf.Uebersicht|/Applications/Übersicht.app|~/.simplebarrc,~/Library/Application Support/Übersicht/widgets/simple-bar/|SM
ubersicht|Übersicht|ubersicht:except=simple-bar|tracesOf.Uebersicht|/Applications/Übersicht.app|~/Library/Application Support/Übersicht/widgets/|ÜB
zebar|Zebar|app|com.glzr.zebar|/Applications/Zebar.app|~/.glzr/zebar/|ZB
